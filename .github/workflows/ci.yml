name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mossdial
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # The bundled tunnel engine is compiled from the pinned cloudflared source, and cloudflared
      # requires Go 1.27.3. Its cgo build is what gives the binary Android's resolver; a pure-Go
      # build cannot resolve the Cloudflare API on a phone.
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.3'
          cache: false

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      # The NDK and CMake are not optional: the llama.cpp runtime is compiled from the vendored
      # sources during the build, and the version here has to match ndkVersion and the cmake version
      # in app/build.gradle.kts. Without them :app:assembleRelease fails at the native build step
      # rather than at anything to do with the code.
      - name: Install Android packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" \
                    "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Verify the published file set
        # Catches a model, vocabulary, keystore or build output that reached the index, and confirms
        # the internal planning documents are still ignored.
        run: |
          set -euo pipefail
          cd ..
          files=$(git add -An --dry-run . | wc -l | tr -d ' ')
          echo "$files files would be published"
          # Dry-run output quotes paths ("add 'app/build/…'"), so every pattern has to tolerate a
          # trailing quote. The trailing-quote group is what the previous guard missed.
          if git add -An --dry-run . | grep -E "app/build/|.*/build/|\.gguf'?$|\.onnx'?$|vocab\.txt'?$|keystore/|local\.properties'?$|\.apk'?$|\.aab'?$"; then
            echo "A build artifact, model, or secret is in the way of publishing" >&2
            exit 1
          fi
          if git ls-files --error-unmatch MOSSDIAL_PLAN.md >/dev/null 2>&1; then
            echo "The internal plan document is tracked but should be ignored" >&2
            exit 1
          fi

      # Release is the only variant built and tested. Minification is where the two third-party
      # runtimes can be stripped, since neither ships consumer rules, and a stripped class fails on
      # a device rather than here. This catches the build failing; it does not catch the runtime
      # failure, which is what the device checklist in RELEASING.md is for.
      - name: Build, test and lint the release
        run: |
          ./gradlew :app:testReleaseUnitTest :app:assembleRelease \
                    :app:lintRelease :app:lintVitalRelease

      - name: Upload the release APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mossdial-release
          path: mossdial/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
